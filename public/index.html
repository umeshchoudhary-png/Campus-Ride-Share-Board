<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Ride Share Board</title>
</head>
<body>
    <header>
        <h1>Campus Ride Share Board</h1>
        <p>Find and share rides with students on campus.</p>
    </header>

    <main>
        <section>
            <h2>Available Rides</h2>
            <label for="search">Search rides:</label>
<input type="text" id="search" placeholder="Search by destination">

            <div id="ride-list">
                <p>No rides available yet.</p>
            </div>
        </section>

        <section>
            <h2>Share a Ride</h2>

            <form id="ride-form">
                <label for="name">Your Name:</label>
                <input type="text" id="name" required>

                <br><br>

                <label for="from">From:</label>
                <input type="text" id="from" required>

                <br><br>

                <label for="to">To:</label>
                <input type="text" id="to" required>

                <br><br>

                <label for="time">Time:</label>
                <input type="time" id="time" required>

                <br><br>

                <button type="submit">Post Ride</button>
            </form>
        </section>
    </main>
<script src="app.js"></script>
</body>
</html>
